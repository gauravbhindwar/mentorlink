name: Build and Push Docker Image to SDC Docker Registry

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_NAME: mentor-mentee
  IMAGE_NAME: mentor_mentee

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3
        with:
          ref: "main"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to SDC Docker Registry
        uses: docker/login-action@v3
        with:
          registry: docker.sdcmuj.com
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./infra/Dockerfile
          push: true
          tags: |
            docker.sdcmuj.com/${{env.IMAGE_NAME}}:latest
            docker.sdcmuj.com/${{env.IMAGE_NAME}}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sync image names and tags with Deployment Platform
        run: |
          curl --fail -X POST \
            -H "Authorization: Bearer ${{ secrets.DEPLOYMENT_PLATFORM_GITHUB_PAT }}" \
            "${{ secrets.DEPLOYMENT_PLATFORM_URL }}/image-names/${{ env.PROJECT_NAME }}/${{env.IMAGE_NAME}}/${{ github.sha }}"
